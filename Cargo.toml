[package]
name = "ncknot-web"
version = "0.1.0"
edition = "2021"
description = "A browser workbench for knots: draw diagrams or build braids, compute ncknot invariants in WebAssembly."
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/aidan-epperly/ncknot-web"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ncknot = { git = "https://github.com/aidan-epperly/ncknot", default-features = false }
faer = { version = "0.24", default-features = false, features = ["std", "linalg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
